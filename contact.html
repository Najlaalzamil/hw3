<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>
</head>

<body id="top">

<header>
    <h1>Contact Me</h1>

    <nav role="navigation">
        <a href="index.html">Home</a>
        <a href="cv.html">CV</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

    <form action="mailto:najlaalzamil@gmail.com"
          method="post"
          enctype="text/plain">

        <fieldset>

            <legend>Contact Me</legend>

            <p>
                <label for="firstName">First Name:</label>
                <input type="text"
                       id="firstName"
                       name="firstName"
                       required>
            </p>

            <p>
                <label for="lastName">Last Name:</label>
                <input type="text"
                       id="lastName"
                       name="lastName"
                       required>
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email"
                       id="email"
                       name="email"
                       required>
            </p>

            <p>
                <label for="message">Message:</label>
            </p>

            <p>
                <textarea id="message"
                          name="message"
                          rows="6"
                          cols="40"
                          required></textarea>
            </p>

            <p>
                <input type="submit" value="Send">
            </p>

        </fieldset>

    </form>

    <p>
        Or email me directly:
        <a href="mailto:najlaalzamil@gmail.com">
            najlaalzamil@gmail.com
        </a>
    </p>

    <p>
        <a href="#top">Back to Top</a>
    </p>

</main>
